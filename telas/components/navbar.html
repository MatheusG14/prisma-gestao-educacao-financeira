<!-- Navbar -->
      <header class="navbar">
        <div class="navbar-left">
          <button type="button" class="mobile-menu" id="mobileMenu" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
            <i data-lucide="menu"></i>
          </button>
          <div class="search-box" id="globalSearchBox">
            <i data-lucide="search"></i>
            <input type="search" id="globalSearchInput" placeholder="Pesquisar transações, contas, metas..." autocomplete="off" aria-label="Busca global" aria-expanded="false" aria-controls="globalSearchResults" />
            <button type="button" class="search-clear" id="globalSearchClear" title="Limpar" aria-label="Limpar pesquisa" hidden>
              <i data-lucide="x"></i>
            </button>
            <kbd>⌘ K</kbd>
            <div class="global-search-results" id="globalSearchResults" hidden role="listbox" aria-label="Resultados da pesquisa"></div>
          </div>
        </div>

        <div class="navbar-right">
          <div class="notification-wrap">
            <button class="icon-btn notification-btn" id="notificationBtn" type="button" aria-label="Notificações" aria-expanded="false" aria-controls="notificationsPanel">
              <i data-lucide="bell"></i>
              <span class="notification-dot" aria-hidden="true"></span>
            </button>
            <div class="notifications-panel" id="notificationsPanel" role="dialog" aria-label="Central de notificações" aria-hidden="true" hidden>
              <div class="notifications-head">
                <div>
                  <h3>Central de notificações</h3>
                  <p id="notificationsSummary">Nenhuma notificação nova</p>
                </div>
                <button type="button" class="notifications-mark-read" id="markNotificationsRead">Marcar como lidas</button>
              </div>
              <div class="notifications-list" id="notificationsList"></div>
              <div class="notifications-empty" id="notificationsEmpty">
                <i data-lucide="bell-off"></i>
                <strong>Tudo em dia</strong>
                <span>Você não tem notificações novas.</span>
              </div>
            </div>
          </div>
          <button type="button" class="avatar" id="avatarDropdownBtn" aria-label="Abrir menu do perfil" aria-expanded="false" aria-controls="profileDropdown">
            <span class="avatar-placeholder" aria-hidden="true">
              <i data-lucide="user"></i>
            </span>
            <span class="avatar-name" id="navbarUserName">Usuário</span>
            <i data-lucide="chevron-down" class="avatar-chevron"></i>
            <span class="avatar-status"></span>
          </button>
          
          <!-- Dropdown do Perfil -->
          <div class="profile-dropdown" id="profileDropdown" aria-hidden="true">
            <div class="profile-dropdown-header">
              <div class="profile-dropdown-avatar">
                <div class="avatar-placeholder">
                  <i data-lucide="user-round"></i>
                </div>
              </div>
              <div class="profile-dropdown-info">
                <h4 id="dropdownProfileName">-</h4>
                <p id="dropdownProfileEmail">-</p>
              </div>
            </div>
            <div class="profile-dropdown-stats">
              <div class="dropdown-stat">
                <span class="dropdown-stat-label">Saldo</span>
                <span class="dropdown-stat-value" id="dropdownProfileBalance">R$ 0,00</span>
              </div>
              <div class="dropdown-stat">
                <span class="dropdown-stat-label">Receitas</span>
                <span class="dropdown-stat-value" id="dropdownProfileIncome">R$ 0,00</span>
              </div>
              <div class="dropdown-stat">
                <span class="dropdown-stat-label">Despesas</span>
                <span class="dropdown-stat-value" id="dropdownProfileExpenses">R$ 0,00</span>
              </div>
            </div>
            <div class="profile-dropdown-actions">
              <button class="dropdown-action-btn" id="dropdownEditProfile">
                <i data-lucide="edit"></i> <span>Editar Perfil</span>
              </button>
              <button class="dropdown-action-btn danger" id="dropdownLogout">
                <i data-lucide="log-out"></i> <span>Sair</span>
              </button>
            </div>
          </div>
        </div>
      </header>
