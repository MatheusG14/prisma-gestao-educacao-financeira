<!-- ============ ADMIN ============ -->
<section class="section active" id="admin">
  <div class="section-header">
    <div>
      <span class="eyebrow">Administração</span>
      <h2>Painel Administrativo</h2>
      <p>Gerencie usuários e permissões do Prisma.</p>
    </div>
    <div class="section-actions">
      <button type="button" class="btn btn-primary" id="addAdminBtn">
        <i data-lucide="user-plus"></i> Adicionar administrador
      </button>
    </div>
  </div>
  <div class="card" style="overflow:auto">
    <table class="data-table" id="adminUsersTable">
      <thead>
        <tr>
          <th>Usuário</th>
          <th>E-mail</th>
          <th>Role</th>
          <th>Status</th>
          <th>Último acesso</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>
